<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada | Silink</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A2533">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    :root { --blue-700:#0E7AA6; --blue-900:#0A2533; --green:#42AD4C; --muted:#44555E; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; text-align:center;
           font-family: system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; line-height:1.6; color:#17262E; background:#F2F7FA; }
    main { max-width: 460px; }
    img { height:44px; width:auto; margin:0 auto 32px; }
    h1 { margin:0 0 .4em; font-size:2rem; color:var(--blue-900); line-height:1.2; }
    p { margin:0 0 1.5em; color:var(--muted); font-size:1.1rem; }
    .code { font-size:.9rem; font-weight:700; letter-spacing:.1em; color:var(--blue-700); margin-bottom:8px; }
    a.btn { display:inline-flex; align-items:center; justify-content:center; min-height:50px; padding:0 1.6rem; border-radius:12px;
            background:var(--green); color:var(--blue-900); font-weight:700; text-decoration:none; }
    a.btn:hover { background:#389A42; }
    a:focus-visible { outline:3px solid var(--blue-700); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo-horizontal.png" alt="Silink" width="164" height="36">
    <p class="code">ERROR 404</p>
    <h1>No encontramos esa página</h1>
    <p>Puede que el enlace haya cambiado o que esté mal escrito. Volvé al inicio y te ayudamos desde ahí.</p>
    <a class="btn" href="/">Volver al inicio</a>
  </main>
</body>
</html>
